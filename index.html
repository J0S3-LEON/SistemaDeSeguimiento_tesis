<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gestión de Tesis - Recolección de Datos</title>
    <!-- Tailwind CSS para el diseño adaptable -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- React y ReactDOM para la interactividad y manejo de estado -->
    <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
    <!-- Babel para compilar JSX en el navegador -->
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    
    <!-- Librería para Exportar a Excel (SheetJS) -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
    
    <!-- Librerías para Exportar a PDF (jsPDF + autoTable) -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.8.1/jspdf.plugin.autotable.min.js"></script>

    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; background-color: #f3f4f6; }
        /* Transiciones suaves para modales */
        .modal-enter { opacity: 0; transform: scale(0.95); }
        .modal-enter-active { opacity: 1; transform: scale(1); transition: opacity 200ms, transform 200ms; }
    </style>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect, useMemo } = React;
        const API_BASE_URL = 'http://localhost:4000';
        const STORAGE_KEY = 'tesis-seguimiento-institutions-v1';

        // Iconos reutilizables en formato SVG
        const MapPinIcon = () => (<svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M21 10c0 7-9 13-9 13s-9-6-9-13a9 9 0 0 1 18 0z"></path><circle cx="12" cy="10" r="3"></circle></svg>);
        const DownloadIcon = () => (<svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path><polyline points="7 10 12 15 17 10"></polyline><line x1="12" y1="15" x2="12" y2="3"></line></svg>);
        const PdfIcon = () => (<svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"></path><polyline points="14 2 14 8 20 8"></polyline><path d="M9 15v-4.5"></path><path d="M12 15v-4.5"></path><path d="M15 15v-4.5"></path></svg>);
        const EditIcon = () => (<svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"></path><path d="M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z"></path></svg>);
        const CloseIcon = () => (<svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><line x1="18" y1="6" x2="6" y2="18"></line><line x1="6" y1="6" x2="18" y2="18"></line></svg>);
        const SearchIcon = () => (<svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><circle cx="11" cy="11" r="8"></circle><line x1="21" y1="21" x2="16.65" y2="16.65"></line></svg>);
        const FileTextIcon = () => (<svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"></path><polyline points="14 2 14 8 20 8"></polyline><line x1="16" y1="13" x2="8" y2="13"></line><line x1="16" y1="17" x2="8" y2="17"></line><polyline points="10 9 9 9 8 9"></polyline></svg>);

        const TrendUpIcon = () => (<svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><polyline points="23 6 13.5 15.5 8.5 10.5 1 18"></polyline><polyline points="17 6 23 6 23 12"></polyline></svg>);
        const CheckCircleIcon = () => (<svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"></path><polyline points="22 4 12 14.01 9 11.01"></polyline></svg>);
        const ClockIcon = () => (<svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><circle cx="12" cy="12" r="10"></circle><polyline points="12 6 12 12 16 14"></polyline></svg>);
        const AlertTriangleIcon = () => (<svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M10.29 3.86L1.82 18a2 2 0 0 0 1.71 3h16.94a2 2 0 0 0 1.71-3L13.71 3.86a2 2 0 0 0-3.42 0z"></path><line x1="12" y1="9" x2="12" y2="13"></line><line x1="12" y1="17" x2="12.01" y2="17"></line></svg>);

        // Generador de la estructura para los 3 seguimientos requeridos
        const getInitialFollowUps = () => [
            { id: 1, date: '', contact: '', notes: '', status: 'Pendiente' },
            { id: 2, date: '', contact: '', notes: '', status: 'Pendiente' },
            { id: 3, date: '', contact: '', notes: '', status: 'Pendiente' }
        ];

        // Datos iniciales extraídos del ListadoPadron (1).xls
        const initialInstitutions = [
            { id: 1, name: "Lobachevsky", address: "Av. 26 de Enero 248, Ayacucho", phone: "", status: "Pendiente", contact: "", priority: "Media", followUps: getInitialFollowUps() },
            { id: 2, name: "San Juan Bosco", address: "Jr. Cuzco 153, Ayacucho", phone: "", status: "Pendiente", contact: "", priority: "Media", followUps: getInitialFollowUps() },
            { id: 3, name: "El Buen Pastor", address: "Jr. Grau 824, Ayacucho", phone: "", status: "Pendiente", contact: "", priority: "Media", followUps: getInitialFollowUps() },
            { id: 4, name: "Pascual Saco Oliveros", address: "Jr. Garcilazo de la Vega 777-785, Ayacucho", phone: "", status: "Pendiente", contact: "Justiniano Jaico Coras", priority: "Media", followUps: getInitialFollowUps() },
            { id: 5, name: "San Agustín", address: "Jr. 9 de Diciembre 362, Ayacucho", phone: "", status: "Pendiente", contact: "Victor De La Cruz Eyzaguirre", priority: "Alta", followUps: getInitialFollowUps() },
            { id: 6, name: "Leonardo Da Vinci", address: "Jr. Callao 264, Ayacucho", phone: "", status: "Pendiente", contact: "Eduardo Franco Ramirez Quijada", priority: "Media", followUps: getInitialFollowUps() },
            { id: 7, name: "Cesar Abraham Vallejo", address: "Jr. Pizarro 370, Ayacucho", phone: "", status: "Pendiente", contact: "Alejandro Aybar Meza", priority: "Media", followUps: getInitialFollowUps() },
            { id: 8, name: "Jean Piaget", address: "Av. Mariscal Caceres 1030, Ayacucho", phone: "", status: "Pendiente", contact: "Liliana Palomino Landeo", priority: "Alta", followUps: getInitialFollowUps() },
            { id: 9, name: "María Auxiliadora", address: "Jr. Callao 250, Ayacucho", phone: "", status: "Pendiente", contact: "", priority: "Media", followUps: getInitialFollowUps() },
            { id: 10, name: "Center", address: "Jr. Garcilaso de la Vega 461, Ayacucho", phone: "", status: "Pendiente", contact: "Luis Villa Perez", priority: "Media", followUps: getInitialFollowUps() },
            { id: 11, name: "Nazareno", address: "Jr. Garcilazo de la Vega 277, Ayacucho", phone: "", status: "Pendiente", contact: "Oswaldo Avelino Guerra Hernandez", priority: "Media", followUps: getInitialFollowUps() }
        ];

        const StatCard = ({ title, count, subtitle, icon, iconColorClass, iconBgClass }) => (
            <div className="p-5 rounded-2xl shadow-sm border border-gray-100 bg-white flex items-center gap-4 hover:shadow-md transition-shadow">
                <div className={`p-3.5 rounded-xl flex items-center justify-center shrink-0 ${iconBgClass} ${iconColorClass}`}>
                    {icon}
                </div>
                <div className="flex flex-col">
                    <span className="text-gray-500 text-sm font-medium">{title}</span>
                    <span className="text-2xl sm:text-3xl font-bold text-gray-800 mt-0.5">{count}</span>
                    <span className="text-gray-400 text-xs mt-1">{subtitle}</span>
                </div>
            </div>
        );

        // Componente de Toast (Notificación)
        const Toast = ({ message, isVisible }) => {
            if (!isVisible) return null;
            return (
                <div className="fixed bottom-4 right-4 bg-gray-800 text-white px-6 py-3 rounded-lg shadow-lg z-50 flex items-center gap-2 animate-bounce">
                    {message}
                </div>
            );
        };

        // Modal de Edición de Institución
        const EditModal = ({ isOpen, institution, onClose, onSave }) => {
            const [formData, setFormData] = useState(null);

            useEffect(() => {
                if (institution) setFormData(JSON.parse(JSON.stringify(institution))); // Deep copy
            }, [institution]);

            if (!isOpen || !formData) return null;

            const handleFollowUpChange = (index, field, value) => {
                const updatedFollowUps = [...formData.followUps];
                updatedFollowUps[index][field] = value;
                setFormData({ ...formData, followUps: updatedFollowUps });
            };

            return (
                <div className="fixed inset-0 bg-gray-900 bg-opacity-60 flex justify-center items-center p-2 sm:p-4 z-50">
                    <div className="bg-white rounded-2xl shadow-2xl w-full max-w-4xl max-h-[95vh] overflow-hidden flex flex-col">
                        
                        {/* Cabecera del Modal */}
                        <div className="bg-indigo-50 border-b border-indigo-100 px-6 py-4 flex justify-between items-center shrink-0">
                            <div>
                                <h2 className="text-2xl font-bold text-indigo-900">{formData.name}</h2>
                                <p className="text-sm text-indigo-700">Gestionar solicitud y seguimientos</p>
                            </div>
                            <button onClick={onClose} className="text-indigo-400 hover:text-indigo-800 transition-colors p-1 rounded-full hover:bg-indigo-100">
                                <CloseIcon />
                            </button>
                        </div>

                        {/* Cuerpo del Modal (Scrollable) */}
                        <div className="p-6 overflow-y-auto flex-1 bg-gray-50 grid grid-cols-1 md:grid-cols-2 gap-8">
                            
                            {/* Columna Izquierda: Info General y Estado */}
                            <div className="space-y-5 bg-white p-5 rounded-xl border shadow-sm">
                                <h3 className="font-semibold text-gray-800 border-b pb-2">Información y Estado General</h3>
                                
                                <div>
                                    <label className="text-sm font-medium text-gray-600 block mb-1">Estado de la Solicitud</label>
                                    <select 
                                        value={formData.status} 
                                        onChange={e => setFormData({...formData, status: e.target.value})}
                                        className="w-full border-gray-300 rounded-lg p-2.5 bg-gray-50 border focus:ring-2 focus:ring-indigo-500 font-medium"
                                    >
                                        <option value="Pendiente">⏳ Pendiente (Por entregar)</option>
                                        <option value="Entregado">📩 Entregado (Esperando respuesta)</option>
                                        <option value="En Seguimiento">🔄 En Seguimiento</option>
                                        <option value="Completado">✅ Completado (Datos recolectados)</option>
                                        <option value="Rechazado">❌ Rechazado</option>
                                    </select>
                                </div>

                                <div>
                                    <label className="text-sm font-medium text-gray-600 block mb-1">Prioridad</label>
                                    <select 
                                        value={formData.priority} 
                                        onChange={e => setFormData({...formData, priority: e.target.value})}
                                        className="w-full border-gray-300 rounded-lg p-2 bg-gray-50 border focus:ring-2 focus:ring-indigo-500"
                                    >
                                        <option value="Alta">🔴 Alta</option>
                                        <option value="Media">🟡 Media</option>
                                        <option value="Baja">🟢 Baja</option>
                                    </select>
                                </div>

                                <div>
                                    <label className="text-sm font-medium text-gray-600 block mb-1">Dirección (Ubicación)</label>
                                    <input 
                                        type="text" value={formData.address} 
                                        onChange={e => setFormData({...formData, address: e.target.value})}
                                        className="w-full border-gray-300 rounded-lg p-2 bg-gray-50 border focus:ring-2 focus:ring-indigo-500"
                                    />
                                </div>

                                <div className="grid grid-cols-2 gap-4">
                                    <div>
                                        <label className="text-sm font-medium text-gray-600 block mb-1">Contacto / Director</label>
                                        <input 
                                            type="text" value={formData.contact} placeholder="Nombre..."
                                            onChange={e => setFormData({...formData, contact: e.target.value})}
                                            className="w-full border-gray-300 rounded-lg p-2 bg-gray-50 border focus:ring-2 focus:ring-indigo-500"
                                        />
                                    </div>
                                    <div>
                                        <label className="text-sm font-medium text-gray-600 block mb-1">Teléfono</label>
                                        <input 
                                            type="text" value={formData.phone} placeholder="Ej. 999 999 999"
                                            onChange={e => setFormData({...formData, phone: e.target.value})}
                                            className="w-full border-gray-300 rounded-lg p-2 bg-gray-50 border focus:ring-2 focus:ring-indigo-500"
                                        />
                                    </div>
                                </div>
                            </div>

                            {/* Columna Derecha: Seguimientos */}
                            <div className="space-y-4">
                                <h3 className="font-semibold text-gray-800 border-b pb-2">Registro de Seguimientos (3 Mínimo)</h3>
                                
                                {formData.followUps.map((fu, index) => (
                                    <div key={fu.id} className="bg-white border rounded-xl p-4 shadow-sm relative">
                                        <div className="absolute top-0 right-0 bg-indigo-100 text-indigo-800 text-xs font-bold px-2 py-1 rounded-bl-lg rounded-tr-xl">
                                            # {index + 1}
                                        </div>
                                        <div className="grid grid-cols-2 gap-3 mb-3 mt-1">
                                            <div>
                                                <label className="text-xs font-medium text-gray-500 block mb-1">Fecha de visita/llamada</label>
                                                <input 
                                                    type="date" value={fu.date} 
                                                    onChange={e => handleFollowUpChange(index, 'date', e.target.value)}
                                                    className="w-full border rounded-md px-2 py-1.5 text-sm bg-gray-50 focus:ring-1 focus:ring-indigo-500"
                                                />
                                            </div>
                                            <div>
                                                <label className="text-xs font-medium text-gray-500 block mb-1">Estado del seguimiento</label>
                                                <select 
                                                    value={fu.status} 
                                                    onChange={e => handleFollowUpChange(index, 'status', e.target.value)}
                                                    className="w-full border rounded-md px-2 py-1.5 text-sm bg-gray-50 focus:ring-1 focus:ring-indigo-500"
                                                >
                                                    <option value="Pendiente">Pendiente</option>
                                                    <option value="Realizado">Realizado</option>
                                                    <option value="Reprogramado">Reprogramado</option>
                                                </select>
                                            </div>
                                        </div>
                                        <div>
                                            <label className="text-xs font-medium text-gray-500 block mb-1">Observaciones / Respuestas</label>
                                            <textarea 
                                                value={fu.notes} 
                                                onChange={e => handleFollowUpChange(index, 'notes', e.target.value)}
                                                placeholder="Ej. El director indicó que revisará la solicitud el viernes..."
                                                className="w-full border rounded-md px-2 py-2 text-sm bg-gray-50 focus:ring-1 focus:ring-indigo-500 h-16 resize-none"
                                            ></textarea>
                                        </div>
                                    </div>
                                ))}
                            </div>
                        </div>

                        {/* Pie del Modal */}
                        <div className="bg-white border-t px-6 py-4 flex justify-end gap-3 shrink-0">
                            <button onClick={onClose} className="px-5 py-2 text-gray-600 hover:bg-gray-100 rounded-lg font-medium transition-colors">
                                Cancelar
                            </button>
                            <button onClick={() => onSave(formData)} className="px-5 py-2 bg-indigo-600 hover:bg-indigo-700 text-white rounded-lg font-medium shadow-sm transition-colors flex items-center gap-2">
                                Guardar Cambios
                            </button>
                        </div>
                    </div>
                </div>
            );
        };

        const exportStatusColors = {
            Pendiente: {
                fill: { fgColor: { rgb: 'FFF7ED' } },
                font: { color: { rgb: 'B45309' }, bold: true }
            },
            Entregado: {
                fill: { fgColor: { rgb: 'DBEAFE' } },
                font: { color: { rgb: '1D4ED8' }, bold: true }
            },
            'En Seguimiento': {
                fill: { fgColor: { rgb: 'F3E8FF' } },
                font: { color: { rgb: '7C3AED' }, bold: true }
            },
            Completado: {
                fill: { fgColor: { rgb: 'DCFCE7' } },
                font: { color: { rgb: '166534' }, bold: true }
            },
            Rechazado: {
                fill: { fgColor: { rgb: 'FEE2E2' } },
                font: { color: { rgb: 'B91C1C' }, bold: true }
            },
            Realizado: {
                fill: { fgColor: { rgb: 'DCFCE7' } },
                font: { color: { rgb: '166534' }, bold: true }
            },
            Reprogramado: {
                fill: { fgColor: { rgb: 'FEF3C7' } },
                font: { color: { rgb: 'A16207' }, bold: true }
            }
        };

        const App = () => {
            const [institutions, setInstitutions] = useState(initialInstitutions);
            const [searchTerm, setSearchTerm] = useState('');
            const [selectedInst, setSelectedInst] = useState(null);
            const [isModalOpen, setIsModalOpen] = useState(false);
            const [toastInfo, setToastInfo] = useState({ show: false, message: '' });

            const saveToLocalStorage = (data) => {
                localStorage.setItem(STORAGE_KEY, JSON.stringify(data));
            };

            const readStoredInstitutions = () => {
                try {
                    const saved = localStorage.getItem(STORAGE_KEY);
                    if (!saved) return [];
                    const parsed = JSON.parse(saved);
                    return Array.isArray(parsed) && parsed.length > 0 ? parsed : [];
                } catch (error) {
                    console.warn('No se pudieron leer los datos guardados:', error.message);
                    return [];
                }
            };

            const loadInstitutions = async () => {
                const saved = readStoredInstitutions();

                if (saved.length > 0) {
                    setInstitutions(saved);
                }

                try {
                    const response = await fetch(`${API_BASE_URL}/api/institutions`);
                    if (!response.ok) throw new Error('No se pudo cargar la data');

                    const data = await response.json();
                    if (!Array.isArray(data) || data.length === 0) {
                        if (saved.length > 0) {
                            setInstitutions(saved);
                        }
                        return;
                    }

                    if (saved.length === 0) {
                        setInstitutions(data);
                        saveToLocalStorage(data);
                        return;
                    }

                    // Si ya hay datos guardados en el navegador, se priorizan para evitar
                    // que el backend en modo fallback (default) sobrescriba cambios del usuario.
                    setInstitutions(saved);
                    saveToLocalStorage(saved);
                } catch (error) {
                    console.warn('Usando datos locales porque el backend no está disponible:', error.message);
                    if (saved.length > 0) {
                        setInstitutions(saved);
                    } else {
                        setInstitutions(initialInstitutions);
                    }
                }
            };

            useEffect(() => {
                loadInstitutions();
            }, []);

            useEffect(() => {
                saveToLocalStorage(institutions);
            }, [institutions]);

            const showToast = (message) => {
                setToastInfo({ show: true, message });
                setTimeout(() => setToastInfo({ show: false, message: '' }), 3500);
            };

            // Derivar datos estadísticos
            const stats = useMemo(() => {
                return {
                    total: institutions.length,
                    pendientes: institutions.filter(i => i.status === 'Pendiente').length,
                    entregados: institutions.filter(i => i.status === 'Entregado' || i.status === 'En Seguimiento').length,
                    completados: institutions.filter(i => i.status === 'Completado').length,
                };
            }, [institutions]);

            // Filtrado
            const filteredInstitutions = useMemo(() => {
                return institutions.filter(inst => 
                    inst.name.toLowerCase().includes(searchTerm.toLowerCase()) || 
                    inst.status.toLowerCase().includes(searchTerm.toLowerCase())
                );
            }, [institutions, searchTerm]);

            const handleEditClick = (inst) => {
                setSelectedInst(inst);
                setIsModalOpen(true);
            };

            const handleSaveModal = async (updatedInst) => {
                const nextState = institutions.map(i => i.id === updatedInst.id ? updatedInst : i);
                setInstitutions(nextState);
                saveToLocalStorage(nextState);
                setIsModalOpen(false);

                try {
                    const response = await fetch(`${API_BASE_URL}/api/institutions/${updatedInst.id}`, {
                        method: 'PUT',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify(updatedInst)
                    });

                    if (!response.ok) throw new Error('No se pudo guardar');

                    const result = await response.json();
                    const savedInst = result?.data || updatedInst;
                    const syncedState = nextState.map(i => i.id === savedInst.id ? savedInst : i);
                    setInstitutions(syncedState);
                    saveToLocalStorage(syncedState);
                    showToast(`Se actualizaron los datos de ${savedInst.name}`);
                    return;
                } catch (error) {
                    console.warn('Guardado local:', error.message);
                    showToast(`Se actualizaron los datos de ${updatedInst.name}`);
                }
            };

            const handleStatusChange = async (id, newStatus) => {
                const institution = institutions.find(item => item.id === id);
                if (!institution) return;

                const updated = { ...institution, status: newStatus };
                const nextState = institutions.map(i => i.id === id ? updated : i);
                setInstitutions(nextState);
                saveToLocalStorage(nextState);

                try {
                    const response = await fetch(`${API_BASE_URL}/api/institutions/${id}`, {
                        method: 'PUT',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify(updated)
                    });
                    if (!response.ok) throw new Error('No se pudo actualizar');
                    showToast(`Estado actualizado a "${newStatus}" exitosamente.`);
                } catch (error) {
                    console.warn('Cambio local:', error.message);
                    showToast(`Estado actualizado a "${newStatus}" exitosamente.`);
                }
            };

            // Exportación avanzada a formato Excel nativo (.xlsx)
            const exportToExcel = () => {
                const dataToExport = institutions.map(inst => ({
                    'ID': inst.id,
                    'Institución': inst.name,
                    'Dirección': inst.address,
                    'Teléfono': inst.phone,
                    'Contacto (Director)': inst.contact,
                    'Estado General': inst.status,
                    'Prioridad': inst.priority,
                    'Seguimiento 1 (Estado)': inst.followUps[0].status,
                    'Seguimiento 1 (Fecha)': inst.followUps[0].date || 'Sin fecha',
                    'Seguimiento 2 (Estado)': inst.followUps[1].status,
                    'Seguimiento 2 (Fecha)': inst.followUps[1].date || 'Sin fecha',
                    'Seguimiento 3 (Estado)': inst.followUps[2].status,
                    'Seguimiento 3 (Fecha)': inst.followUps[2].date || 'Sin fecha'
                }));

                const worksheet = XLSX.utils.json_to_sheet(dataToExport);

                Object.keys(worksheet).forEach((cellAddress) => {
                    const cell = worksheet[cellAddress];
                    if (!cell || typeof cell.v !== 'string') return;
                    const style = exportStatusColors[cell.v];
                    if (!style) return;
                    cell.s = style;
                });

                const wscols = [
                    {wch:5}, {wch:35}, {wch:45}, {wch:15}, {wch:35}, 
                    {wch:20}, {wch:15}, {wch:22}, {wch:20}, {wch:22}, 
                    {wch:20}, {wch:22}, {wch:20}
                ];
                worksheet['!cols'] = wscols;

                const workbook = XLSX.utils.book_new();
                XLSX.utils.book_append_sheet(workbook, worksheet, "Avance de Tesis");
                
                XLSX.writeFile(workbook, "Reporte_Tesis_Instituciones.xlsx");
                showToast("Archivo Excel descargado exitosamente.");
            };

            // Exportación a PDF con formato de tabla profesional
            const exportToPDF = () => {
                const { jsPDF } = window.jspdf;
                const doc = new jsPDF('landscape'); 

                doc.setFontSize(16);
                doc.setTextColor(55, 48, 163);
                doc.text("Reporte de Gestión - Trabajo de Campo (Tesis)", 14, 15);
                
                doc.setFontSize(10);
                doc.setTextColor(100);
                doc.text(`Fecha de reporte: ${new Date().toLocaleDateString()} | Ayacucho, Perú`, 14, 22);

                const tableColumn = ["ID", "Institución", "Dirección", "Estado", "Contacto", "Seg. 1", "Seg. 2", "Seg. 3"];
                const tableRows = [];

                institutions.forEach(inst => {
                    const instData = [
                        inst.id,
                        inst.name,
                        inst.address,
                        inst.status,
                        inst.contact || 'Sin registro',
                        inst.followUps[0].status,
                        inst.followUps[1].status,
                        inst.followUps[2].status
                    ];
                    tableRows.push(instData);
                });

                doc.autoTable({
                    head: [tableColumn],
                    body: tableRows,
                    startY: 28,
                    theme: 'grid',
                    styles: { fontSize: 8, cellPadding: 2, overflow: 'linebreak', textColor: [15, 23, 42] },
                    headStyles: { fillColor: [79, 70, 229], textColor: [255, 255, 255] },
                    alternateRowStyles: { fillColor: [249, 250, 251] },
                    columnStyles: {
                        1: { cellWidth: 45 },
                        2: { cellWidth: 50 },
                        3: { cellWidth: 28 },
                        4: { cellWidth: 25 },
                        5: { cellWidth: 35 },
                        6: { cellWidth: 22 },
                        7: { cellWidth: 22 },
                        8: { cellWidth: 22 }
                    },
                    didParseCell: function (data) {
                        const statusMap = {
                            Pendiente: { fillColor: [255, 247, 237], textColor: [180, 83, 9] },
                            Entregado: { fillColor: [219, 234, 254], textColor: [29, 78, 216] },
                            'En Seguimiento': { fillColor: [243, 232, 255], textColor: [124, 58, 237] },
                            Completado: { fillColor: [220, 252, 231], textColor: [22, 101, 52] },
                            Rechazado: { fillColor: [254, 226, 226], textColor: [185, 28, 28] },
                            Realizado: { fillColor: [220, 252, 231], textColor: [22, 101, 52] },
                            Reprogramado: { fillColor: [254, 243, 199], textColor: [161, 98, 7] }
                        };

                        const statusValue = data.cell.raw;
                        const cellStyle = statusMap[statusValue];

                        if (!cellStyle || data.section !== 'body') return;

                        const columnIndex = data.column.index;
                        if (columnIndex === 3 || columnIndex === 5 || columnIndex === 6 || columnIndex === 7) {
                            data.cell.styles.fillColor = cellStyle.fillColor;
                            data.cell.styles.textColor = cellStyle.textColor;
                            data.cell.styles.fontStyle = 'bold';
                        }
                    }
                });

                doc.save("Reporte_Tesis_Instituciones.pdf");
                showToast("Reporte PDF generado exitosamente.");
            };

            const getStatusColor = (status) => {
                switch(status) {
                    case 'Pendiente': return 'bg-yellow-100 text-yellow-800 border-yellow-200';
                    case 'Entregado': return 'bg-blue-100 text-blue-800 border-blue-200';
                    case 'En Seguimiento': return 'bg-purple-100 text-purple-800 border-purple-200';
                    case 'Completado': return 'bg-green-100 text-green-800 border-green-200';
                    case 'Rechazado': return 'bg-red-100 text-red-800 border-red-200';
                    default: return 'bg-gray-100 text-gray-800 border-gray-200';
                }
            };

            return (
                <div className="min-h-screen pb-12">
                    {/* Top Navigation */}
                    <header className="bg-indigo-900 text-white shadow-md">
                        <div className="max-w-7xl mx-auto px-4 py-4 flex flex-col sm:flex-row justify-between items-center gap-4">
                            <div>
                                <h1 className="text-xl font-bold flex items-center gap-2">
                                    <FileTextIcon /> Sistema de Gestión - Tesis (Trabajo de Campo)
                                </h1>
                                <p className="text-indigo-200 text-sm mt-1">Ayacucho, Perú - Recolección de Datos</p>
                            </div>
                            <div className="flex flex-wrap gap-2 sm:gap-3">
                                <button 
                                    onClick={() => showToast("La sincronización directa con 'ListadoPadron (1).xls' requiere de integración de un módulo de lectura Excel/Backend en un futuro. Los datos base ya están cargados.")} 
                                    className="bg-indigo-800 hover:bg-indigo-700 text-indigo-100 px-3 py-2 rounded-lg text-sm font-medium transition-colors border border-indigo-700 flex items-center gap-2"
                                >
                                    <FileTextIcon /> Info BD
                                </button>
                                <button 
                                    onClick={exportToPDF} 
                                    className="bg-rose-600 hover:bg-rose-700 text-white px-4 py-2 rounded-lg text-sm font-medium transition-colors shadow-sm flex items-center gap-2"
                                >
                                    <PdfIcon /> Exportar PDF
                                </button>
                                <button 
                                    onClick={exportToExcel} 
                                    className="bg-emerald-500 hover:bg-emerald-600 text-white px-4 py-2 rounded-lg text-sm font-medium transition-colors shadow-sm flex items-center gap-2"
                                >
                                    <DownloadIcon /> Exportar Excel
                                </button>
                            </div>
                        </div>
                    </header>

                    <main className="max-w-7xl mx-auto px-4 mt-8">
                        
                        <div className="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-4 gap-4 mb-8">
                            <StatCard 
                                title="Progreso Total" 
                                count={stats.total > 0 ? `${Math.round((stats.completados / stats.total) * 100)}%` : '0%'} 
                                subtitle={`${stats.completados} de ${stats.total} instituciones`}
                                icon={<TrendUpIcon />}
                                iconBgClass="bg-blue-50"
                                iconColorClass="text-blue-500"
                            />
                            <StatCard 
                                title="Aprobados" 
                                count={stats.completados} 
                                subtitle={`De ${stats.total} instituciones`}
                                icon={<CheckCircleIcon />}
                                iconBgClass="bg-green-50"
                                iconColorClass="text-green-500"
                            />
                            <StatCard 
                                title="En Trámite" 
                                count={stats.entregados} 
                                subtitle="Entregados o en evaluación"
                                icon={<ClockIcon />}
                                iconBgClass="bg-yellow-50"
                                iconColorClass="text-yellow-600"
                            />
                            <StatCard 
                                title="Pendientes" 
                                count={stats.pendientes} 
                                subtitle="Sin iniciar contacto"
                                icon={<AlertTriangleIcon />}
                                iconBgClass="bg-slate-100"
                                iconColorClass="text-slate-600"
                            />
                        </div>

                        {/* Contenedor de la Tabla */}
                        <div className="bg-white rounded-xl shadow-sm border border-gray-200 overflow-hidden">
                            
                            {/* Barra de Búsqueda y Filtros */}
                            <div className="p-4 border-b border-gray-200 bg-gray-50 flex items-center">
                                <div className="relative w-full max-w-md">
                                    <div className="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none text-gray-400">
                                        <SearchIcon />
                                    </div>
                                    <input
                                        type="text"
                                        placeholder="Buscar institución por nombre o estado..."
                                        value={searchTerm}
                                        onChange={(e) => setSearchTerm(e.target.value)}
                                        className="pl-10 w-full rounded-lg border-gray-300 border p-2 focus:ring-2 focus:ring-indigo-500 bg-white shadow-sm"
                                    />
                                </div>
                            </div>

                            {/* Tabla Responsiva */}
                            <div className="overflow-x-auto">
                                <table className="w-full text-left border-collapse min-w-[800px]">
                                    <thead>
                                        <tr className="bg-gray-50 text-gray-500 text-xs uppercase font-bold border-b tracking-wider">
                                            <th className="px-6 py-4">Institución</th>
                                            <th className="px-6 py-4">Ubicación</th>
                                            <th className="px-6 py-4 text-center">Estado</th>
                                            <th className="px-6 py-4 text-center">Seguimientos</th>
                                            <th className="px-6 py-4 text-center">Acciones</th>
                                        </tr>
                                    </thead>
                                    <tbody className="divide-y divide-gray-100">
                                        {filteredInstitutions.map((inst) => {
                                            const completedFollowUps = inst.followUps.filter(f => f.status === 'Realizado').length;
                                            // Enlace dinámico a Google Maps (útil para visitar en campo)
                                            const mapLink = `https://www.google.com/maps/search/?api=1&query=${encodeURIComponent(inst.name + ' Ayacucho Peru')}`;
                                            
                                            return (
                                                <tr key={inst.id} className="hover:bg-indigo-50 transition-colors bg-white">
                                                    <td className="px-6 py-4">
                                                        <div className="font-semibold text-gray-800">{inst.name}</div>
                                                        <div className="text-xs text-gray-500 mt-1 flex gap-2">
                                                            <span className={inst.priority === 'Alta' ? 'text-red-600 font-medium' : ''}>
                                                                Prioridad: {inst.priority}
                                                            </span>
                                                            {inst.contact && <span>• Cont: {inst.contact}</span>}
                                                        </div>
                                                    </td>
                                                    <td className="px-6 py-4 text-sm text-gray-600">
                                                        <div className="flex items-start gap-2">
                                                            <a href={mapLink} target="_blank" rel="noreferrer" title="Ver en Maps" className="text-indigo-500 hover:text-indigo-700 mt-0.5 shrink-0">
                                                                <MapPinIcon />
                                                            </a>
                                                            <span>{inst.address}</span>
                                                        </div>
                                                    </td>
                                                    <td className="px-6 py-4 text-center">
                                                        <select
                                                            value={inst.status}
                                                            onChange={(e) => handleStatusChange(inst.id, e.target.value)}
                                                            className={`px-3 py-1.5 w-full text-xs font-semibold rounded-full border cursor-pointer appearance-none text-center outline-none focus:ring-2 focus:ring-indigo-500 shadow-sm transition-colors ${getStatusColor(inst.status)}`}
                                                            style={{ textAlignLast: 'center' }}
                                                        >
                                                            <option value="Pendiente">Pendiente</option>
                                                            <option value="Entregado">Entregado</option>
                                                            <option value="En Seguimiento">En Seguimiento</option>
                                                            <option value="Completado">Completado</option>
                                                            <option value="Rechazado">Rechazado</option>
                                                        </select>
                                                    </td>
                                                    <td className="px-6 py-4 text-center">
                                                        <div className="flex justify-center gap-1">
                                                            {inst.followUps.map((fu, i) => (
                                                                <div 
                                                                    key={i} 
                                                                    title={`Seguimiento ${i+1}: ${fu.status}`}
                                                                    className={`w-3 h-3 rounded-full ${fu.status === 'Realizado' ? 'bg-green-500' : fu.status === 'Reprogramado' ? 'bg-yellow-400' : 'bg-gray-200 border border-gray-300'}`}
                                                                ></div>
                                                            ))}
                                                        </div>
                                                        <span className="text-xs text-gray-500 mt-1 block">{completedFollowUps}/3 Realizados</span>
                                                    </td>
                                                    <td className="px-6 py-4 text-center">
                                                        <button 
                                                            onClick={() => handleEditClick(inst)}
                                                            className="text-indigo-600 hover:text-white border border-indigo-600 hover:bg-indigo-600 px-3 py-1.5 rounded-lg text-sm font-medium transition-colors inline-flex items-center gap-1"
                                                        >
                                                            <EditIcon /> Gestionar
                                                        </button>
                                                    </td>
                                                </tr>
                                            );
                                        })}
                                        {filteredInstitutions.length === 0 && (
                                            <tr>
                                                <td colSpan="5" className="px-6 py-8 text-center text-gray-500">
                                                    No se encontraron instituciones con ese criterio.
                                                </td>
                                            </tr>
                                        )}
                                    </tbody>
                                </table>
                            </div>
                        </div>
                    </main>

                    {/* Modales y Alertas */}
                    <EditModal 
                        isOpen={isModalOpen} 
                        institution={selectedInst} 
                        onClose={() => setIsModalOpen(false)} 
                        onSave={handleSaveModal} 
                    />
                    
                    <Toast message={toastInfo.message} isVisible={toastInfo.show} />
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
